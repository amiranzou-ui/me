<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ameer Al-Butaihi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      background:#f0ebe0;
      overflow:hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.038;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    .frame-corner {
      position: fixed;
      width: 44px;
      height: 44px;
      pointer-events: none;
      z-index: 15;
    }
    .frame-corner::before {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: #c4b49a;
      transform: rotate(45deg);
    }
    .fc-tl { top: 22px; left: 22px; background: linear-gradient(to right, #c4b49a, transparent) top left / 100% 1px no-repeat, linear-gradient(to bottom, #c4b49a, transparent) top left / 1px 100% no-repeat; }
    .fc-tl::before { top: -2px; left: -2px; }
    .fc-tr { top: 22px; right: 22px; background: linear-gradient(to left, #c4b49a, transparent) top right / 100% 1px no-repeat, linear-gradient(to bottom, #c4b49a, transparent) top right / 1px 100% no-repeat; }
    .fc-tr::before { top: -2px; right: -2px; left: auto; }
    .fc-bl { bottom: 22px; left: 22px; background: linear-gradient(to right, #c4b49a, transparent) bottom left / 100% 1px no-repeat, linear-gradient(to top, #c4b49a, transparent) bottom left / 1px 100% no-repeat; }
    .fc-bl::before { bottom: -2px; left: -2px; top: auto; }
    .fc-br { bottom: 22px; right: 22px; background: linear-gradient(to left, #c4b49a, transparent) bottom right / 100% 1px no-repeat, linear-gradient(to top, #c4b49a, transparent) bottom right / 1px 100% no-repeat; }
    .fc-br::before { bottom: -2px; right: -2px; top: auto; left: auto; }

    #stage {
      width:100%; height:100vh;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:22px; padding:40px;
    }

    .line {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(20px, 2.8vw, 30px);
      letter-spacing: 0.5px;
      color: #2c2416;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s ease, transform 1s ease;
    }

    #l3 {
      font-size: clamp(14px, 1.8vw, 20px);
      color: #c4622d;
      margin-top: 8px;
    }

    #enter-btn {
      margin-top: 48px;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #8a7a65;
      text-decoration: none;
      border-bottom: 1px solid #c4b49a;
      padding-bottom: 4px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 1s ease, transform 1s ease, color 0.3s, border-color 0.3s;
    }

    #enter-btn:hover {
      color: #c4622d;
      border-color: #c4622d;
    }

    @media (prefers-reduced-motion: reduce) {
      .line, #enter-btn { transition: opacity 0.4s ease; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="frame-corner fc-tl"></div>
  <div class="frame-corner fc-tr"></div>
  <div class="frame-corner fc-bl"></div>
  <div class="frame-corner fc-br"></div>

  <div id="stage">
    <div class="line" id="l1">I don't chase things.</div>
    <div class="line" id="l2">They just keep being interesting.</div>
    <div class="line" id="l3">I arrived here by curiosity. You probably did too.</div>
    <a href="index.html" id="enter-btn">Enter</a>
  </div>

  <script>
    function show(el) {
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }
    setTimeout(() => show(document.getElementById('l1')), 400);
    setTimeout(() => show(document.getElementById('l2')), 1400);
    setTimeout(() => show(document.getElementById('l3')), 2400);
    setTimeout(() => show(document.getElementById('enter-btn')), 3400);
  </script>
</body>
</html>
