<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mind layer — editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>

  <!-- ── Toolbar ── -->
  <header id="ed-toolbar">
    <div class="tb-group">
      <span class="tb-title">✦ mind layer</span>
      <div class="tb-divider"></div>
      <button class="tb-btn mode-btn active" id="btn-edit">edit</button>
      <button class="tb-btn mode-btn" id="btn-preview">preview</button>
    </div>
    <div class="tb-group tb-center">
      <button class="tb-btn" id="btn-add-text">+ text</button>
      <button class="tb-btn" id="btn-add-image">+ image</button>
      <button class="tb-btn" id="btn-add-audio">+ audio</button>
      <button class="tb-btn" id="btn-add-void">+ void</button>
      <div class="tb-divider"></div>
      <button class="tb-btn" id="btn-timeline">timeline</button>
      <button class="tb-btn" id="btn-analyze">analyze</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn" id="btn-fit">fit view</button>
      <div class="tb-divider"></div>
      <a class="tb-btn" href="mind.html">← layer</a>
    </div>
  </header>

  <!-- ── Workspace ── -->
  <div id="ed-workspace">

    <!-- Canvas wrap (clips + handles events) -->
    <div id="ed-canvas-wrap">
      <div id="ed-canvas">
        <svg id="ed-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <!-- nodes injected here -->
      </div>

      <!-- Zoom controls -->
      <div id="ed-zoom-ctrl">
        <button class="zoom-btn" id="btn-zoom-in">+</button>
        <span id="zoom-label">100%</span>
        <button class="zoom-btn" id="btn-zoom-out">−</button>
      </div>

      <!-- Mode overlay in preview -->
      <div id="ed-preview-badge">preview</div>
    </div>

    <!-- Inspector panel -->
    <aside id="ed-inspector">
      <div id="insp-empty">
        <p class="insp-hint">select a node<br>to inspect</p>
      </div>

      <div id="insp-form" hidden>
        <div class="insp-id-row">
          <span class="insp-id-label" id="insp-id-display">—</span>
          <span class="insp-type-chip" id="insp-type-chip">text</span>
        </div>

        <div class="insp-field">
          <label class="insp-label">type</label>
          <select class="insp-ctrl" id="insp-type">
            <option value="text">text</option>
            <option value="image">image</option>
            <option value="audio">audio</option>
            <option value="void">void</option>
          </select>
        </div>

        <div class="insp-field">
          <label class="insp-label">content</label>
          <textarea class="insp-ctrl" id="insp-content" rows="4" placeholder="thought…"></textarea>
        </div>

        <div class="insp-field">
          <label class="insp-label">fragment <span class="insp-sub">partial view</span></label>
          <input class="insp-ctrl" id="insp-fragment" placeholder="overheard version…">
        </div>

        <div class="insp-field">
          <label class="insp-label">visibility</label>
          <select class="insp-ctrl" id="insp-vis">
            <option value="true">◉ public</option>
            <option value="partial">◎ partial</option>
            <option value="false">○ private</option>
          </select>
        </div>

        <div class="insp-row">
          <div class="insp-field">
            <label class="insp-label">min visits</label>
            <input class="insp-ctrl" id="insp-minv" type="number" min="1" value="1">
          </div>
          <div class="insp-field">
            <label class="insp-label">delay (s)</label>
            <input class="insp-ctrl" id="insp-delay" type="number" step="0.1" value="1.2">
          </div>
        </div>

        <div class="insp-field">
          <label class="insp-label">
            emotion weight
            <span class="insp-ew-val" id="insp-ew-val">0.50</span>
          </label>
          <input class="insp-slider" id="insp-ew" type="range" min="0" max="1" step="0.05" value="0.5">
          <div class="insp-ew-track">
            <span>quiet</span><span>intense</span>
          </div>
        </div>

        <!-- Connection list -->
        <div class="insp-field">
          <label class="insp-label">connections</label>
          <div id="insp-conn-list" class="insp-conn-list"></div>
        </div>

        <div class="insp-actions">
          <button class="insp-btn save-btn" id="btn-insp-save">save</button>
          <button class="insp-btn del-btn" id="btn-insp-del">delete node</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- ── Timeline (collapsible bottom) ── -->
  <div id="ed-timeline" class="collapsed">
    <div id="tl-header">
      <span class="tl-title">timeline — conceptual flow</span>
      <button id="tl-toggle">▲</button>
    </div>
    <div id="tl-body">
      <div id="tl-track"></div>
    </div>
  </div>

  <!-- ── Status bar ── -->
  <footer id="ed-status">
    <span id="sb-mode">edit mode</span>
    <span class="sb-dot">·</span>
    <span id="sb-nodes">0 nodes</span>
    <span class="sb-dot">·</span>
    <span id="sb-conns">0 connections</span>
    <span class="sb-dot">·</span>
    <span id="sb-sel">nothing selected</span>
    <span class="sb-hint">drag anchor ◦ to connect · scroll to zoom · drag canvas to pan</span>
  </footer>

  <script src="js/editor.js"></script>
</body>
</html>
